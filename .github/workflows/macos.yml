name: macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and package (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version

      - name: Run Swift tests
        run: swift test --scratch-path .build-cache/swift -c release

      - name: Build and verify app archive
        run: ./scripts/package.sh

      - name: Upload macOS build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Guestpad-macOS-arm64
          path: |
            dist/Guestpad-*-macOS-arm64.zip
            dist/Guestpad-*-macOS-arm64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Guestpad-macOS-arm64
          path: release

      - name: Publish ZIP and checksum
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag of the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          archive="Guestpad-$version-macOS-arm64.zip"
          if [[ ! -f "$archive" || ! -f "$archive.sha256" ]]; then
            echo "The tag must match CFBundleShortVersionString in scripts/build.sh." >&2
            exit 1
          fi
          shasum -a 256 -c "$archive.sha256"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Guestpad $version"
